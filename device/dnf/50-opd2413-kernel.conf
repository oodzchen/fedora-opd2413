# The tablet boots only kernel-opd2413. A Fedora kernel would be installed to
# the ESP as the newest entry and would not boot.
[main]
excludepkgs=kernel,kernel-core,kernel-modules,kernel-modules-core,kernel-modules-extra,kernel-uki-virt
# Two kernels fit on the 512 MiB ESP (about 128 MB each): the running one and
# the new one. dnf never removes the running kernel.
installonly_limit=2
