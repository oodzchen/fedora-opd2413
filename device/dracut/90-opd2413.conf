# Fedora's default host-only mode applies: images are generated on the tablet
# itself, so host detection sees the real hardware. A generic image carries
# firmware for every module (about 216 MB) and leaves room for one kernel on
# the 512 MiB ESP. The device firmware named by the device tree is added by the
# opd2413 module and checked by 60-opd2413-initrd-check.install.
add_dracutmodules+=" opd2413 "
compress="zstd"
