# Suspend to RAM as s2idle (suspend to idle). The firmware also offers "deep"
# (PSCI SYSTEM_SUSPEND), which the kernel prefers by default, but on this SoC
# any IPCC/GLINK message from the ADSP ends a deep suspend in full; s2idle
# handles those without leaving suspend (same choice as the erhai project,
# onepluspad-2pro-mainline docs/SUSPEND.md). Verified on the tablet with
# kernel 7.2.15-3: docs/M3-FEATURES.md, M3.3.
#
# No hibernation: the only swap is zram, and restoring the remote processors'
# firmware state after a power cycle is untested on this platform.
# rtcwake and writes to /sys/power/state bypass this file.
[Sleep]
AllowSuspend=yes
MemorySleepMode=s2idle
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
