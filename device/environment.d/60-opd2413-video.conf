# Iris hardware decoding through GStreamer's V4L2 decoders works for H.264 and
# HEVC, but the V4L2 VP9 decoder stalls in players that flush/restart the stream
# at start (seen with Showtime on OPD2413; erhai documents the same and stopped
# promoting that path). Demote it so playbin uses the software VP9 decoder.
# An explicit GST_PLUGIN_FEATURE_RANK from the user or session wins.
GST_PLUGIN_FEATURE_RANK=${GST_PLUGIN_FEATURE_RANK:-v4l2vp9dec:0}
