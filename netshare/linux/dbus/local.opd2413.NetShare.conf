<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="local.opd2413.NetShare"/>
    <allow send_destination="local.opd2413.NetShare"/>
    <allow receive_sender="local.opd2413.NetShare"/>
  </policy>

  <policy at_console="true">
    <allow send_destination="local.opd2413.NetShare"/>
    <allow receive_sender="local.opd2413.NetShare"/>
  </policy>

  <policy group="wheel">
    <allow send_destination="local.opd2413.NetShare"/>
    <allow receive_sender="local.opd2413.NetShare"/>
  </policy>

  <policy context="default">
    <deny send_destination="local.opd2413.NetShare"
          send_interface="local.opd2413.NetShare"
          send_member="SetMode"/>
    <deny send_destination="local.opd2413.NetShare"
          send_interface="local.opd2413.NetShare"
          send_member="AllowPeer"/>
    <deny send_destination="local.opd2413.NetShare"
          send_interface="local.opd2413.NetShare"
          send_member="RemovePeer"/>
    <deny send_destination="local.opd2413.NetShare"
          send_interface="local.opd2413.NetShare"
          send_member="DisconnectNow"/>
    <allow send_destination="local.opd2413.NetShare"
           send_interface="local.opd2413.NetShare"
           send_member="GetStatus"/>
    <allow send_destination="local.opd2413.NetShare"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow receive_sender="local.opd2413.NetShare"/>
  </policy>
</busconfig>
