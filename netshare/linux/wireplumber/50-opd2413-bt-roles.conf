# Restrict BlueZ audio roles to source/AG only so opd-netshare's BR/EDR RFCOMM
# control link does not expose A2DP Sink / HFP HF endpoints and hijack audio
# playback from a paired phone, while keeping Bluetooth headphones/speakers working.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source bap_source hfp_ag hsp_ag ]
}
