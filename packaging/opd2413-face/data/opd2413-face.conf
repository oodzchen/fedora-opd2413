[face]
# Camera selector: matches CameraLocationFront first, then substring in camera id
camera_match = sc820cs
width = 1280
height = 960
warmup_frames = 8
default_timeout_ms = 3500

# SFace cosine similarity threshold (OpenCV default reference is 0.363; 0.42 is stricter)
cosine_threshold = 0.42

# Anti-spoofing level: off | standard | strict
liveness = standard

# Require at least N consecutive matching frames during verification
required_matches = 2

# Minimum face bounding-box width (on capture resolution) to avoid far background triggers
min_face_px = 96

# Minimum Laplacian variance on aligned face crop (rejects blurred screen/printed spoofs)
min_sharpness = 22.0

# Require frame-to-frame difference in live crop (rejects frozen-frame injection)
min_frame_delta = 0.45

# Reject verification while lid is closed (reported by systemd-logind)
reject_when_lid_closed = true
