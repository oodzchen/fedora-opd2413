<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.opd2413.Face1"/>
    <allow send_destination="org.opd2413.Face1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.opd2413.Face1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.opd2413.Face1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.opd2413.Face1"
           send_interface="org.opd2413.Face1"
           send_member="HasEnrolled"/>
    <allow send_destination="org.opd2413.Face1"
           send_interface="org.opd2413.Face1"
           send_member="Verify"/>
    <allow send_destination="org.opd2413.Face1"
           send_interface="org.opd2413.Face1"
           send_member="GetStatus"/>
    <allow send_destination="org.opd2413.Face1"
           send_interface="org.opd2413.Face1"
           send_member="SetLockscreenMode"/>
    <allow send_destination="org.opd2413.Face1"
           send_interface="org.opd2413.Face1"
           send_member="SetPolkitArmed"/>
    <allow send_destination="org.opd2413.Face1"
           send_interface="org.opd2413.Face1"
           send_member="IsPolkitArmed"/>
  </policy>
</busconfig>
