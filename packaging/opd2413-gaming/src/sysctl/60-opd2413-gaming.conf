# OPD2413 gaming & desktop responsiveness tuning (SM8750, 16 GiB RAM + 8 GiB zstd zram)

# Do not let realtime audio threads (PipeWire) pin Oryon cores to max clock.
# Matches SteamOS Frame / Zaviya tuning (default 1024 -> 64).
kernel.sched_util_clamp_min_rt_default = 64

# Keep zram responsive without aggressively swapping out active game/asset pages
# mid-frame under 16 GiB unified RAM+VRAM load (150 triggered kswapd spikes ~12 GiB).
vm.swappiness = 60

# Cap dirty writeback backlog so Steam downloads / game extraction do not build
# multi-gigabyte write queues that stall interactive UI and game reads.
vm.dirty_bytes = 536870912
vm.dirty_background_bytes = 67108864

# Larger receive socket buffer for Steam Remote Play / streaming bursts.
net.core.rmem_max = 33554432
